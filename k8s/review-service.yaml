apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: 610595224833.dkr.ecr.us-east-1.amazonaws.com/review-service:latest
          ports:
            - containerPort: 8003
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb-service:27017"
            - name: SECRET_KEY
              value: "some_very_long_random_string_at_least_32_chars"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:29092"
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
spec:
  selector:
    app: review-service
  ports:
    - port: 8003
      targetPort: 8003
  type: ClusterIP
