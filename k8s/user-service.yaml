apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: 610595224833.dkr.ecr.us-east-1.amazonaws.com/user-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: MONGO_URL
              value: "mongodb://mongodb-service:27017"
            - name: SECRET_KEY
              value: "some_very_long_random_string_at_least_32_chars"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
