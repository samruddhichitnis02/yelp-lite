services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - yelp-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - yelp-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - SECRET_KEY=some_very_long_random_string_at_least_32_chars
    volumes:
      - user_uploads:/app/uploads
    networks:
      - yelp-network

  owner-service:
    build:
      context: ./backend/owner-service
      dockerfile: Dockerfile
    container_name: owner-service
    ports:
      - "8004:8004"
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - SECRET_KEY=some_very_long_random_string_at_least_32_chars
    networks:
      - yelp-network

  restaurant-service:
    build:
      context: ./backend/restaurant-service
      dockerfile: Dockerfile
    container_name: restaurant-service
    ports:
      - "8002:8002"
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - SECRET_KEY=some_very_long_random_string_at_least_32_chars
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - restaurant_uploads:/app/uploads
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - yelp-network

  review-service:
    build:
      context: ./backend/review-service
      dockerfile: Dockerfile
    container_name: review-service
    ports:
      - "8003:8003"
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - SECRET_KEY=some_very_long_random_string_at_least_32_chars
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - yelp-network

  review-worker:
    build:
      context: ./backend/review-worker-service
      dockerfile: Dockerfile
    container_name: review-worker
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - yelp-network

  restaurant-worker:
    build:
      context: ./backend/restaurant-worker-service
      dockerfile: Dockerfile
    container_name: restaurant-worker
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - yelp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - user-service
      - owner-service
      - restaurant-service
      - review-service
    networks:
      - yelp-network

volumes:
  user_uploads:
  restaurant_uploads:

networks:
  yelp-network:
    driver: bridge